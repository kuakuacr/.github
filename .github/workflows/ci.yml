name: CI

# Workflow reutilizable. Los repos de Kua'kua lo invocan con:
#   jobs:
#     ci:
#       uses: kuakuacr/.github/.github/workflows/ci.yml@main
#       with: { node: true, docker: true }
#
# Siempre corre gitleaks. El resto de linters se activan por input.

on:
  workflow_call:
    inputs:
      node:
        description: "Validar sintaxis JavaScript/Node"
        type: boolean
        default: false
      docker:
        description: "hadolint sobre Dockerfiles"
        type: boolean
        default: false
      yaml:
        description: "yamllint sobre YAML"
        type: boolean
        default: true
      shell:
        description: "shellcheck sobre scripts .sh"
        type: boolean
        default: true
      html:
        description: "htmlhint sobre archivos .html"
        type: boolean
        default: false
      n8n:
        description: "Validar JSON de workflows n8n y sanidad de nodos"
        type: boolean
        default: false
      runner:
        description: >
          Etiqueta del runner. "ubuntu-latest" (default) paga minutos de
          Actions; "self-hosted" corre en el runner de ops (Fase 2 del plan
          de ahorro) y no consume el plan de minutos.
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  HADOLINT_VERSION: "2.14.0"

# Un solo job, no dos: GitHub factura cada job redondeado hacia arriba al
# minuto. Con gitleaks y lint como jobs separados, una corrida de 40s de cada
# uno facturaba 2 minutos aunque el reloj real fuera de 1. Fusionados y
# secuenciales (gitleaks primero, siempre), el piso baja a 1 minuto por
# corrida — a costa de que un fallo de lint ya no corre en paralelo con
# gitleaks, lo cual no importa: si gitleaks encuentra un secreto, el resto
# tampoco debería correr.
jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # historia completa: un secreto en un commit anterior del branch también cuenta

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Obtener la configuración canónica
        run: |
          set -euo pipefail
          # La config vive en kuakuacr/.github y se descarga en cada corrida.
          #
          # Por qué no se usa la copia del repositorio: cada repo lleva un
          # .gitleaks.toml para que funcione el hook de pre-commit, pero esas
          # copias se desactualizan en cuanto cambia la canónica — pasó a la hora
          # de crear los repos, y el efecto fue que CI marcó como secreto un
          # marcador __PLACEHOLDER__ que la versión nueva ya permitía.
          # CI siempre usa la fuente de verdad; la copia local es solo para hooks.
          # El parametro ?v= evita el cache del CDN de raw.githubusercontent,
          # que sirve el archivo hasta ~5 minutos desactualizado. Sin esto, un
          # arreglo en la config canonica no surte efecto de inmediato: CI
          # sigue fallando con la version vieja y no hay forma de saber cuando
          # dejara de hacerlo salvo reintentar a ciegas. Ya paso una vez.
          if curl -sSfL -o /tmp/gitleaks-canon.toml \
               "https://raw.githubusercontent.com/kuakuacr/.github/main/.gitleaks.toml?v=${GITHUB_RUN_ID}"; then
            echo "CONFIG=/tmp/gitleaks-canon.toml" >> "$GITHUB_ENV"
            echo "usando configuración canónica de kuakuacr/.github"
          elif [ -f .gitleaks.toml ]; then
            echo "CONFIG=.gitleaks.toml" >> "$GITHUB_ENV"
            echo "::warning::no se pudo descargar la config canónica; usando la copia local"
          else
            echo "CONFIG=" >> "$GITHUB_ENV"
            echo "::warning::sin configuración propia; usando las reglas por defecto de gitleaks"
          fi

      - name: Escanear árbol de trabajo
        run: |
          set -euo pipefail
          ARGS=(dir . --redact --exit-code 1 --verbose)
          [ -n "${CONFIG:-}" ] && ARGS+=(--config "$CONFIG")
          gitleaks "${ARGS[@]}"

      - name: Escanear historia de commits
        run: |
          set -euo pipefail
          ARGS=(git . --redact --exit-code 1)
          [ -n "${CONFIG:-}" ] && ARGS+=(--config "$CONFIG")
          gitleaks "${ARGS[@]}"

      - name: yamllint
        if: inputs.yaml
        run: |
          set -euo pipefail
          # El venv va a RUNNER_TEMP, no al PIPX_HOME global (/opt/pipx): ese
          # path compartido rompía en los dos runners. En el self-hosted el
          # contenedor no siempre se recicla entre corridas y el venv de la
          # corrida anterior hacía fallar la siguiente con "Not installing to
          # existing directory" — de ahí venía el --force, que se queda de
          # cinturón. En el runner de GitHub era peor: la imagen ya trae
          # /opt/pipx/venvs/yamllint y es de root, así que pipx moría con
          # "Operation not permitted" al intentar reemplazarlo y `yaml: true`
          # nunca había funcionado fuera del self-hosted. RUNNER_TEMP se
          # limpia entre jobs y es del usuario del job: ninguno de los dos
          # casos aplica.
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/pipx/bin"
          export PATH="$PIPX_BIN_DIR:$PATH"
          pipx install --force yamllint
          # Preset `relaxed`: los problemas REALES (sintaxis inválida, claves
          # duplicadas) siguen siendo errores y hacen fallar el build; lo cosmético
          # (indentación, líneas largas, comentarios) baja a advertencia.
          #
          # Es deliberado: los docker-compose.yml son archivos de producción
          # escritos a mano que funcionan. Reformatearlos para contentar a un
          # linter arriesga romper infraestructura que anda, a cambio de estilo.
          # Sin --strict, las advertencias no fallan.
          if [ -f .yamllint.yml ]; then
            yamllint -d .yamllint.yml .
          else
            yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .
          fi

      - name: shellcheck
        if: inputs.shell
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ ${#FILES[@]} -eq 0 ]; then echo "sin scripts .sh"; exit 0; fi
          shellcheck -S warning "${FILES[@]}"

      - name: hadolint
        if: inputs.docker
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find . -type f -name 'Dockerfile*' -not -path './.git/*')
          if [ ${#FILES[@]} -eq 0 ]; then echo "sin Dockerfiles"; exit 0; fi
          curl -sSfL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          # Solo los errores hacen fallar. Las advertencias (imagen sin fijar,
          # paquetes de apk sin versión) se muestran pero no bloquean: son
          # Dockerfiles de producción que funcionan, y en el caso de Chatwoot la
          # etiqueta `latest` es deliberada — se reconstruye la imagen propia.
          hadolint --failure-threshold error "${FILES[@]}"

      - name: node --check
        if: inputs.node
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*')
          if [ ${#FILES[@]} -eq 0 ]; then echo "sin archivos .js"; exit 0; fi
          for f in "${FILES[@]}"; do node --check "$f"; done
          echo "✓ ${#FILES[@]} archivos JS con sintaxis válida"

      - name: htmlhint
        if: inputs.html
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find . -type f -name '*.html' -not -path './.git/*')
          if [ ${#FILES[@]} -eq 0 ]; then echo "sin archivos .html"; exit 0; fi
          npx --yes htmlhint "${FILES[@]}"

      - name: Validar workflows n8n
        if: inputs.n8n
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(workflows/*.json)
          if [ ${#FILES[@]} -eq 0 ]; then echo "::error::no hay workflows/*.json"; exit 1; fi
          FALLOS=0
          for f in "${FILES[@]}"; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::JSON inválido"; FALLOS=1; continue
            fi
            # Sanidad mínima: debe tener id, name y un arreglo nodes no vacío
            if ! jq -e '(.id? // empty) and (.name? // empty) and (.nodes | type == "array" and length > 0)' "$f" >/dev/null; then
              echo "::error file=$f::falta id/name/nodes"; FALLOS=1; continue
            fi
            # Regla D10: los Code nodes no pueden usar $helpers ni fetch — ambos son
            # undefined en el task runner de n8n 2.26.8, el try/catch se traga el
            # ReferenceError y el nodo reporta éxito sin haber hecho la llamada HTTP.
            #
            # Los workflows que ya violaban la regla al importarlos están listados en
            # workflows/D10-DEUDA.txt. Se reportan como advertencia (son deuda
            # conocida, con issue abierto) pero no bloquean; cualquier workflow
            # NUEVO que la viole sí falla. Así la deuda no crece en silencio.
            if jq -e '[.nodes[] | select(.type=="n8n-nodes-base.code") | .parameters.jsCode // ""]
                      | join("\n") | test("\\$helpers|(^|[^.\\w])fetch\\s*\\(")' "$f" >/dev/null; then
              BASE=$(basename "$f")
              if [ -f workflows/D10-DEUDA.txt ] && grep -qxF "$BASE" workflows/D10-DEUDA.txt; then
                echo "::warning file=$f::deuda D10 conocida: usa \$helpers o fetch (ver workflows/D10-DEUDA.txt)"
              else
                echo "::error file=$f::Code node usa \$helpers o fetch — prohibido (ver docs/RULES.md D10)"; FALLOS=1
              fi
            fi
          done
          [ "$FALLOS" -eq 0 ] && echo "✓ ${#FILES[@]} workflows válidos"
          exit "$FALLOS"

      # El paso de arriba valida estructura y la regla D10, pero nunca miró si
      # quedó una credencial en claro. `sanitize.py --check` existía desde el
      # principio y no lo invocaba nadie: una contraseña real del API de Odoo
      # vivió tres semanas en cinco workflows de kuakua-n8n, desde la
      # importación inicial — el commit que se titulaba, justamente, "secrets
      # replaced by markers". gitleaks tampoco la marcó: son 14 caracteres
      # genéricos, sin forma reconocible.
      #
      # Un check que existe y nadie corre no protege de nada.
      - name: Credenciales saneadas en los workflows
        if: inputs.n8n
        run: |
          set -euo pipefail
          if [ ! -f tooling/sanitize.py ]; then
            echo "::warning::este repo no tiene tooling/sanitize.py — no se puede verificar el saneo"
            exit 0
          fi
          python3 tooling/sanitize.py workflows/ --check
