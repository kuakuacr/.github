name: Release

# Workflow reutilizable de versionado. Genera CHANGELOG.md, hace el tag vX.Y.Z
# y publica un GitHub Release a partir de Conventional Commits.
#
# ⚠️ REQUIERE RELEASE_BOT_PAT, no GITHUB_TOKEN.
# GitHub bloquea a propósito que los eventos generados con el GITHUB_TOKEN por
# defecto disparen otros workflows (protección contra bucles infinitos). Con el
# token por defecto el release se publicaría y el workflow de deploy NUNCA se
# ejecutaría — sin error visible. Un PAT propio rompe esa cadena de bloqueo.
#
# Uso desde un repo:
#   jobs:
#     release:
#       uses: kuakuacr/.github/.github/workflows/release.yml@main
#       secrets: inherit

on:
  workflow_call:
    inputs:
      release_type:
        description: "Tipo de release-please (simple, node, python...)"
        type: string
        default: "simple"
    outputs:
      released:
        description: "true si se publicó una versión nueva"
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: "Tag publicado (ej. v1.4.0)"
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Verificar que exista RELEASE_BOT_PAT
        env:
          PAT: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::Falta el secreto RELEASE_BOT_PAT en este repo."
            echo "::error::Sin él el release se publica pero el deploy nunca se dispara (ver comentario al inicio de release.yml)."
            exit 1
          fi

          # Un salto de línea dentro del valor rompe la cabecera Authorization
          # con "invalid header field value" — un error que no menciona por
          # ningún lado que el problema es un carácter invisible.
          # Pasa al guardar el secreto con `$PAT | gh secret set` en PowerShell:
          # el pipe agrega CRLF. En bash, `printf '%s'` no agrega nada.
          if printf '%s' "$PAT" | grep -q '[[:cntrl:]]'; then
            echo "::error::RELEASE_BOT_PAT contiene un carácter de control (salto de línea o retorno de carro)."
            echo "::error::La API de GitHub lo rechaza con 'invalid header field value for Authorization'."
            echo "::error::Volvé a guardarlo sin el salto final:  printf '%s' \"\$PAT\" | gh secret set RELEASE_BOT_PAT --repo <repo>"
            exit 1
          fi

          LARGO=$(printf '%s' "$PAT" | wc -c)
          if [ "$LARGO" -lt 20 ]; then
            echo "::error::RELEASE_BOT_PAT parece truncado (${LARGO} caracteres)."
            exit 1
          fi

          echo "✓ RELEASE_BOT_PAT presente, sin caracteres de control, ${LARGO} caracteres"

      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_BOT_PAT }}
          release-type: ${{ inputs.release_type }}
