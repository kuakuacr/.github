name: Release a medias — todos los repos

# Reemplaza los crons diarios individuales de `release-a-medias.yml` en cada
# repo por uno solo, acá, en el repositorio público (minutos gratis en
# GitHub Actions). Misma lógica exacta, matrixeada sobre la lista de repos
# que la tenían: cada entrada del matrix hace checkout del repo remoto con
# RELEASE_BOT_PAT y corre la misma verificación que antes.
#
# Requiere en este repositorio (kuakuacr/.github) los secretos:
#   RELEASE_BOT_PAT           (ya existe — lo usa pat-expiry-check.yml)
#   SLACK_BOT_TOKEN
#   PUMBLE_WEBHOOK_DEPLOYMENT
#
# Los dos últimos hay que agregarlos a mano (gh secret set / Settings →
# Secrets) — sus valores no viajan por git ni son legibles desde otro repo.
#
# El detalle completo de por qué existe esta verificación está en
# release-a-medias.yml (el workflow reutilizable original, que sigue siendo
# la fuente de la lógica).

on:
  schedule:
    # 14:23 UTC = 8:23 en Costa Rica (UTC-6, sin horario de verano).
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - kuakua-tarjetas
          - kuakua-infra
          - kuakua-slack-bot
          - kuakua-n8n
          - kuakua-odoo
          - kuakua-cms
          - kuakua-web
          - kuakua-chatwoot
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kuakuacr/${{ matrix.repo }}
          token: ${{ secrets.RELEASE_BOT_PAT }}
          # Hace falta el historial completo para saber CUANDO se escribió la
          # versión, y los tags para saber si el que corresponde existe.
          fetch-depth: 0
          fetch-tags: true

      - name: Comparar la versión declarada contra el tag
        id: rev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
          REPO: kuakuacr/${{ matrix.repo }}
          ARCHIVO: version.txt
          GRACIA: 30
        run: |
          set -uo pipefail

          # Sin `2>/dev/null` a secas sobre asignaciones. Actions corre esto con
          # `bash -e`, donde `X=$(cmd-que-falla 2>/dev/null)` mata el job al
          # instante y sin imprimir NADA.

          if [ ! -f "$ARCHIVO" ]; then
            echo "  este repo no tiene ${ARCHIVO} — nada que verificar"
            echo "estado=sin_archivo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(tr -d ' \t\r\n' < "$ARCHIVO")
          if [ -z "$VERSION" ]; then
            echo "::warning::${ARCHIVO} está vacío"
            echo "estado=sin_archivo" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v${VERSION}"
          echo "  ${ARCHIVO} declara ${VERSION} → se espera el tag ${TAG}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "  ✓ el tag ${TAG} existe"

            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "  ✓ el release ${TAG} está publicado"
              echo "estado=ok" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::existe el tag ${TAG} pero no el release publicado"
              {
                echo "estado=sin_release"
                echo "version=$VERSION"
                echo "tag=$TAG"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # No hay tag. Antes de gritar: ¿este repo llegó a publicar alguna vez?
          # El discriminador es el CHANGELOG: release-please escribe la versión y
          # su entrada en el mismo PR. Version sin entrada = nunca se publicó.
          if [ -f CHANGELOG.md ]; then
            VRE=${VERSION//./\\.}
            if ! grep -qE "^#+ +\[?${VRE}\]?" CHANGELOG.md; then
              echo "  ${ARCHIVO} declara ${VERSION}, pero el CHANGELOG no tiene esa entrada."
              echo "  Es un repo que aún no publicó su primera versión, no un release a medias."
              echo "estado=nunca_publicado" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ¿Hace cuánto se escribió esa versión? Período de gracia: un release
          # recién mergeado legítimamente no tiene tag por un minuto o dos.
          CUANDO=$(git log -1 --format=%ct -- "$ARCHIVO") || CUANDO=""
          [ -n "$CUANDO" ] || CUANDO=0
          EDAD=$(( ( $(date +%s) - CUANDO ) / 60 ))

          if [ "$EDAD" -lt "$GRACIA" ]; then
            echo "  ${TAG} aún no existe, pero ${ARCHIVO} se escribió hace ${EDAD} min"
            echo "  (gracia: ${GRACIA} min) — un release en curso se ve así"
            echo "estado=en_curso" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::${ARCHIVO} dice ${VERSION} pero el tag ${TAG} no existe, y ya pasaron ${EDAD} min"
          {
            echo "estado=sin_tag"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "edad=$EDAD"
          } >> "$GITHUB_OUTPUT"

      - name: Avisar a Slack y Pumble
        if: steps.rev.outputs.estado == 'sin_tag' || steps.rev.outputs.estado == 'sin_release'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PUMBLE_WEBHOOK_DEPLOYMENT: ${{ secrets.PUMBLE_WEBHOOK_DEPLOYMENT }}
          CANAL: "C0BN27QLTRU"
          REPO: kuakuacr/${{ matrix.repo }}
          ESTADO: ${{ steps.rev.outputs.estado }}
          VERSION: ${{ steps.rev.outputs.version }}
          TAG: ${{ steps.rev.outputs.tag }}
        run: |
          set -uo pipefail

          if [ "$ESTADO" = "sin_tag" ]; then
            TEXTO="🏷️ *${REPO}* — release a medias: el repo dice estar en *${VERSION}* pero el tag \`${TAG}\` NO EXISTE.
          En los repos que despliegan con el tag, eso significa que esa versión nunca se desplegó — aunque el CHANGELOG diga que sí.
          Arreglo: re-lanzar el workflow \`Release\` en main.
          https://github.com/${REPO}/actions/workflows/release.yml"
          else
            TEXTO="🏷️ *${REPO}* — existe el tag \`${TAG}\` pero no el release publicado. El despliegue no se ve afectado; falta la entrada visible.
          https://github.com/${REPO}/releases"
          fi

          if [ -n "${SLACK_BOT_TOKEN:-}" ]; then
            R=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
                  -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                  -H 'Content-Type: application/json; charset=utf-8' \
                  -d "$(jq -n --arg c "$CANAL" --arg t "$TEXTO" '{channel:$c, text:$t}')" 2>&1)
            echo "  slack: $(printf '%s' "$R" | jq -r '.ok // .error // "sin respuesta"')"
          else
            echo "::warning::falta SLACK_BOT_TOKEN; no se avisó a Slack"
          fi

          if [ -n "${PUMBLE_WEBHOOK_DEPLOYMENT:-}" ]; then
            curl -sS -X POST "$PUMBLE_WEBHOOK_DEPLOYMENT" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg t "$TEXTO" '{text:$t}')" >/dev/null 2>&1 \
              && echo "  pumble: enviado" || echo "  pumble: falló"
          fi

      - name: El detector se rompió — avisar
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PUMBLE_WEBHOOK_DEPLOYMENT: ${{ secrets.PUMBLE_WEBHOOK_DEPLOYMENT }}
          CANAL: "C0BN27QLTRU"
          REPO: kuakuacr/${{ matrix.repo }}
          RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          TEXTO="🔧 *${REPO}* — el detector de releases a medias FALLÓ.
          Nadie está verificando que la versión declarada tenga su tag hasta que se arregle.
          https://github.com/kuakuacr/.github/actions/runs/${RUN}"

          if [ -n "${SLACK_BOT_TOKEN:-}" ]; then
            R=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
                  -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                  -H 'Content-Type: application/json; charset=utf-8' \
                  -d "$(jq -n --arg c "$CANAL" --arg t "$TEXTO" '{channel:$c, text:$t}')" 2>&1)
            echo "  slack: $(printf '%s' "$R" | jq -r '.ok // .error // "sin respuesta"')"
          fi

          if [ -n "${PUMBLE_WEBHOOK_DEPLOYMENT:-}" ]; then
            curl -sS -X POST "$PUMBLE_WEBHOOK_DEPLOYMENT" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg t "$TEXTO" '{text:$t}')" >/dev/null 2>&1 \
              && echo "  pumble: enviado" || echo "  pumble: falló"
          fi

  # G6 #58 del plan de monitoreo. Job aparte (no un paso mas de `verificar`)
  # porque el heartbeat tiene que reflejar el resultado agregado de TODO el
  # matrix, no de una sola entrada -- pushea solo si las 8 terminaron bien.
  #
  # Este repo no tiene runner self-hosted propio ni acceso a la tailnet. Se
  # probó un nodo efímero tag:ci (tailscale/github-action), pero la ACL de
  # Tailscale lo confina a propósito al puerto 22 de tag:prod
  # (kuakua-infra/docs/ARCHITECTURE.md) -- nunca puede llegar al 443 de
  # Kuma, y ampliar esa ACL abriría TODOS los servicios .io de core/ops a
  # cualquier runner de CI de cualquier repo. En vez de eso, se dispara el
  # relay de kuakua-infra (kuakua-infra#199): su runner self-hosted ya está
  # en la tailnet y hace el push por nosotros.
  heartbeat:
    needs: verificar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Push heartbeat a Kuma (vía relay de kuakua-infra)
        if: needs.verificar.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          gh workflow run heartbeat-relay.yml \
            --repo kuakuacr/kuakua-infra \
            -f token="${{ secrets.KUMA_PUSH_RELEASE_A_MEDIAS }}" || true
