name: Vigilancia de expiración del PAT

# Los PAT de alcance fino expiran (máx. 1 año). Cuando RELEASE_BOT_PAT expira,
# los releases dejan de disparar despliegues EN SILENCIO — no hay error, no hay
# aviso: simplemente nada se despliega. Este job convierte esa falla silenciosa
# en un issue visible.
#
# Sustituir por un GitHub App installation token (que no expira) en la Fase 6.

on:
  schedule:
    - cron: "0 13 * * 1" # lunes 13:00 UTC = 07:00 Costa Rica
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UMBRAL_DIAS: 30
  TITULO: "🔑 RELEASE_BOT_PAT necesita rotación"

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar expiración del token
        id: probe
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "estado=ausente" >> "$GITHUB_OUTPUT"
            echo "detalle=El secreto RELEASE_BOT_PAT no está configurado en este repositorio." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Se consulta el propio repositorio, NO /user.
          #
          # Un PAT de alcance fino con solo permisos de repositorio no puede
          # llamar a GET /user: ese endpoint exige algún permiso de cuenta
          # (Profile, Plan, Email addresses…) que este token deliberadamente no
          # tiene. Usarlo daba 403 y hacía parecer inválido un token sano.
          # Cualquier request autenticado devuelve la cabecera de expiración,
          # así que alcanza con leer el repo — solo requiere Metadata, que es
          # automático.
          if ! RESP=$(gh api -i "repos/${GITHUB_REPOSITORY}" 2>&1); then
            echo "estado=invalido" >> "$GITHUB_OUTPUT"
            # El mensaje de gh no contiene el token; es seguro mostrarlo.
            MSG=$(printf '%s' "$RESP" | head -1 | tr -d '\r')
            echo "detalle=El token fue rechazado por la API de GitHub: ${MSG}" >> "$GITHUB_OUTPUT"
            echo "::warning::respuesta de la API: ${MSG}"
            exit 0
          fi

          EXP=$(printf '%s' "$RESP" \
            | grep -i '^github-authentication-token-expiration:' \
            | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')

          if [ -z "$EXP" ]; then
            # Token clásico sin fecha de expiración: nada que vigilar.
            echo "estado=sin_expiracion" >> "$GITHUB_OUTPUT"
            echo "detalle=El token no declara fecha de expiración." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXP_TS=$(date -u -d "$EXP" +%s 2>/dev/null || echo "")
          if [ -z "$EXP_TS" ]; then
            echo "estado=indeterminado" >> "$GITHUB_OUTPUT"
            echo "detalle=No se pudo interpretar la fecha de expiración: $EXP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIAS=$(( (EXP_TS - $(date -u +%s)) / 86400 ))
          echo "dias=$DIAS" >> "$GITHUB_OUTPUT"
          echo "fecha=$EXP" >> "$GITHUB_OUTPUT"
          echo "Expira en $DIAS día(s) — $EXP"

          if [ "$DIAS" -le "${UMBRAL_DIAS}" ]; then
            echo "estado=por_expirar" >> "$GITHUB_OUTPUT"
            echo "detalle=El token expira en $DIAS día(s) ($EXP)." >> "$GITHUB_OUTPUT"
          else
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir o actualizar el issue de rotación
        if: steps.probe.outputs.estado != 'ok' && steps.probe.outputs.estado != 'sin_expiracion'
        env:
          GH_TOKEN: ${{ github.token }}
          ESTADO: ${{ steps.probe.outputs.estado }}
          DETALLE: ${{ steps.probe.outputs.detalle }}
        run: |
          set -euo pipefail

          CUERPO=$(cat <<EOF
          **Estado:** \`${ESTADO}\`

          ${DETALLE}

          ### Por qué importa
          \`RELEASE_BOT_PAT\` es lo que permite que un release dispare el workflow de
          despliegue. El \`GITHUB_TOKEN\` por defecto no puede hacerlo: GitHub bloquea
          que sus eventos disparen otros workflows. Si este token expira, los releases
          se siguen publicando pero **nada se despliega**, sin ningún error visible.

          ### Cómo rotarlo
          1. Crear un PAT de alcance fino nuevo con permisos \`contents: write\`,
             \`pull_requests: write\`, \`actions: write\` sobre los repos de \`kuakuacr\`.
          2. Actualizar el secreto \`RELEASE_BOT_PAT\` **en cada repo que despliega**
             (en una cuenta personal Free los secretos son por repositorio).
          3. Revocar el token viejo.
          4. Ejecutar este workflow manualmente para confirmar que quedó en \`ok\`.

          ---
          _Generado automáticamente por \`pat-expiry-check.yml\`._
          EOF
          )

          # --repo explícito: este job no hace checkout, así que gh no puede
          # inferir el repositorio desde el directorio de trabajo.
          REPO="${GITHUB_REPOSITORY}"

          EXISTENTE=$(gh issue list --repo "$REPO" --state open \
            --search "$TITULO in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "$REPO" --body "$CUERPO"
            echo "✓ comentario agregado al issue #$EXISTENTE"
          else
            gh issue create --repo "$REPO" --title "$TITULO" --body "$CUERPO"
            echo "✓ issue creado"
          fi

      # G6 #59 del plan de monitoreo (status.kuakua.io/PLAN-monitoreo.md).
      #
      # Este repo no tiene runner self-hosted propio ni acceso a la tailnet.
      # Se probó un nodo efímero tag:ci (tailscale/github-action), pero la
      # ACL de Tailscale lo confina a propósito al puerto 22 de tag:prod
      # (kuakua-infra/docs/ARCHITECTURE.md) -- nunca puede llegar al 443 de
      # Kuma. Ampliar esa ACL abriría TODOS los servicios .io de core/ops a
      # cualquier runner de CI de cualquier repo, no solo a este heartbeat.
      #
      # En vez de eso, se dispara el relay de kuakua-infra (kuakua-infra#199):
      # su runner self-hosted ya está en la tailnet, así que hace el push por
      # nosotros. RELEASE_BOT_PAT ya tiene actions:write sobre kuakua-infra
      # (lo usa este mismo repo para otras cosas); no hace falta un secreto
      # nuevo salvo el token de push, que es de bajo valor (solo marca ESTE
      # monitor puntual como "up").
      - name: Push heartbeat a Kuma (vía relay de kuakua-infra)
        if: steps.probe.outputs.estado == 'ok'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          gh workflow run heartbeat-relay.yml \
            --repo kuakuacr/kuakua-infra \
            -f token="${{ secrets.KUMA_PUSH_PAT_EXPIRY }}" || true
